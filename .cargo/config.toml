# The .exe code is 32-bit x86: the loader must be 32-bit as well.
# static musl avoids needing a 32-bit system libc (no sudo).
# i586 (no SSE): MSVC code does not align the stack to 16 bytes, and Rust with SSE
# assumes that alignment (movaps), which causes SIGSEGV inside std.
[build]
target = "i586-unknown-linux-musl"
